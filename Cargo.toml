[package]
name = "byoh"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "BuildYourOwnHarness — interactive profiling + harness compiler + evolution engine. Generates a personalized AI agent harness from a user's tacit knowledge, data sources, genre, and goals."
license = "Apache-2.0"
repository = "https://github.com/epicsagas/BuildYourOwnHarness"
homepage = "https://github.com/epicsagas/BuildYourOwnHarness"
readme = "README.md"
keywords = ["ai", "agent-harness", "compiler", "profiling", "mcp"]
categories = ["command-line-utilities", "config"]

[[bin]]
name = "byoh"
path = "src/main.rs"

[lib]
name = "byoh"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization (YAML frontmatter profiles, JSON bundles/MCP, TOML configs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Errors
anyhow = "1"
thiserror = "1"

# Paths / globbing / walk for non-destructive autoscan
walkdir = "2"

# Regex (citation extraction, secret masking)
regex = "1"

# Time (timestamps, decay/recency, crash staleness)
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Hashing (source_profile_hash, provenance)
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
indexmap = { version = "2", features = ["serde"] }

# llm-kernel — native RAG (embeddings + quantized vector index + CJK chunking).
# OPTIONAL: only pulled in via the `native-rag` feature so default builds stay
# light (no fastembed/ort model download). Maps to spec R1.
llm-kernel = { version = "0.9.1", optional = true }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[features]
default = []
# Enable BYOH's self-contained RAG subsystem (genre indexes, hybrid search).
# Turns on llm-kernel's fastembed backend (local multilingual-e5-small model).
# OpenAI embeddings remain behind the `rag-openai` sub-feature (opt-in).
native-rag = ["dep:llm-kernel", "llm-kernel/embedding", "llm-kernel/embedding-fastembed", "llm-kernel/vector-index", "llm-kernel/tokens"]
# Opt-in: use OpenAI embeddings instead of/in addition to local fastembed.
# Requires an API key at runtime; off by default (no external LLM calls in default builds).
rag-openai = ["native-rag", "llm-kernel/embedding-openai"]

