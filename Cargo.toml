[package]
name = "byoh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "BuildYourOwnHarness — interactive profiling + harness compiler + evolution engine. Generates a personalized AI agent harness from a user's tacit knowledge, genre, and goals."
license = "Apache-2.0"
repository = "https://github.com/epicsagas/BuildYourOwnHarness"
homepage = "https://github.com/epicsagas/BuildYourOwnHarness"
readme = "README.md"
keywords = ["ai", "agent-harness", "compiler", "profiling", "mcp"]
categories = ["command-line-utilities", "config"]

[[bin]]
name = "byoh"
path = "src/main.rs"

[lib]
name = "byoh"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization (YAML frontmatter profiles, JSON bundles/MCP, TOML configs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Errors
anyhow = "1"
thiserror = "1"

# Paths / globbing / walk for non-destructive autoscan
walkdir = "2"

# Regex (citation extraction, secret masking)
regex = "1"

# Time (timestamps, decay/recency, crash staleness)
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Hashing (source_profile_hash, provenance)
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
indexmap = { version = "2", features = ["serde"] }

# HTTP client for awesomeclaudeplugins.com sitemap crawl (`byoh catalog index`).
ureq = { version = "2", features = ["tls"] }

# gzip decode for the prebuilt remote catalog bundle (`catalog.json.gz`).
flate2 = "1"

# MCP server (PR #3) — expose BYOH capabilities as a stdio MCP server (`byoh serve`).
# OPTIONAL: only pulled in via the `mcp` feature so default builds stay light
# (no async runtime). rmcp = official Rust MCP SDK; schemars = its JSON-schema dep.
rmcp = { version = "1.8", optional = true, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", optional = true, features = ["full"] }
schemars = { version = "1", optional = true }

[build-dependencies]
# build.rs: parse registry/vendored/MANIFEST.toml to codegen the vendored catalog.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
# mcp_tools integration tests mutate process-global env vars (BYOH_HOME /
# BYOH_DIST_DIR); serial_test forces those tests to run one at a time so
# parallel cargo-test threads don't clobber each other's env.
serial_test = "3"

[features]
# `mcp` is on by default: the primary BYOH interface is the stdio MCP server
# (`byoh serve`, agent-led mode), and the shipped plugin's .mcp.json calls it.
# This also ensures cargo-dist release binaries support serve out of the box.
default = ["mcp"]

# Expose BYOH capabilities as a stdio MCP server (`byoh serve`).
# Pulls in the tokio runtime + rmcp SDK + schemars for tool-param schemas.
# Default builds stay light (no async runtime) — this is opt-in, inverting
# control so an LLM agent drives BYOH via MCP tools instead of the CLI.
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]

