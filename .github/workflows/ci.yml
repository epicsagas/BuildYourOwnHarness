# CI — workspace-standard Rust gate (check / clippy / fmt / test).
# Matches the workspace CLAUDE.md convention shared across all epiccounty
# Rust projects. Runs on every push to main and on every PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, pinned to rust-version)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      # 1. fmt — must be clean.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # 2. clippy — deny warnings across all targets and the default feature set
      #    (mcp is on by default).
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # 3. check — every target compiles.
      - name: cargo check
        run: cargo check --all-targets

      # 3b. check the light (CLI-only) configuration too — the non-mcp cfg arms
      #     rot silently otherwise.
      - name: cargo check (no default features)
        run: cargo check --no-default-features

      # 4. test — unit + e2e + MCP integration.
      - name: cargo test
        run: cargo test --all-targets
